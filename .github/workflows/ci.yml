name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint gate (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Test both stores with coverage gate
        run: >-
          sh scripts/test-with-postgres.sh python
          --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build container image
        run: docker build --pull -t shelfops:ci .
      - name: Smoke-test container
        run: sh scripts/smoke-test-image.sh shelfops:ci
      - name: Scan image with Trivy (HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: shelfops:ci
          scanners: vuln
          format: table
          output: trivy-gate.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 5m0s
      - name: Show Trivy gate report
        if: ${{ always() && hashFiles('trivy-gate.txt') != '' }}
        run: cat trivy-gate.txt
      - name: Upload Trivy gate report
        if: ${{ always() && hashFiles('trivy-gate.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-gate-report
          path: trivy-gate.txt
          if-no-files-found: error
          retention-days: 14
