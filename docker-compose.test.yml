# Dedicated ephemeral database. Never mounts the application's data volume.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelfops_test
      POSTGRES_PASSWORD: shelfops-test-only
      POSTGRES_DB: shelfops_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfops_test -d shelfops_test"]
      interval: 1s
      timeout: 3s
      retries: 30
