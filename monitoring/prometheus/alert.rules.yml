groups:
  - name: shelfops
    rules:
      - alert: ShelfOpsDown
        expr: up{job="shelfops"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ShelfOps ist nicht erreichbar"
          description: "Prometheus kann {{ $labels.instance }} seit mindestens einer Minute nicht abrufen."

      - alert: HighErrorRate
        expr: |
          (
            (
              sum(rate(flask_http_request_total{job="shelfops",status=~"5.."}[5m]))
              or vector(0)
            )
            /
            sum(rate(flask_http_request_total{job="shelfops"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hohe Serverfehlerrate bei ShelfOps"
          description: "Die 5xx-Fehlerrate liegt seit fünf Minuten über 5 %."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(flask_http_request_duration_seconds_bucket{job="shelfops"}[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hohe p95-Antwortzeit bei ShelfOps"
          description: "Die geschätzte p95-Antwortzeit liegt seit fünf Minuten über einer Sekunde."

      - alert: HighClientErrorRate
        expr: |
          (
            sum(rate(flask_http_request_total{job="shelfops",status=~"4.."}[5m]))
            /
            sum(rate(flask_http_request_total{job="shelfops"}[5m]))
          ) > 0.20
          and
          sum(increase(flask_http_request_total{job="shelfops"}[5m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Viele ShelfOps-Anfragen werden mit 4xx abgewiesen"
          description: "Seit fünf Minuten liegt der 4xx-Anteil über 20 %, bei mindestens 100 erfassten Anfragen im jeweiligen Fünf-Minuten-Fenster."
