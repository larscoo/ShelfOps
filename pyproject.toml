[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfops"
version = "0.1.0"
description = "Small library API for the CDS212 DevOps project"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
    "build>=1.2,<2",
]

[tool.setuptools]
packages = ["app"]
py-modules = ["wsgi"]
include-package-data = false

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
