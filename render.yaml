# Adapted from CDS212 week 6
services:
  - type: web
    name: shelfops
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # GitHub Actions triggers the deploy hook after successful CI.
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8000"
      # Without DATABASE_URL, every worker would have its own in-memory data.
      - key: GUNICORN_WORKERS
        value: "1"
      - key: APP_VERSION
        value: "1.0.0"
    # No database or disk: this lab instance uses volatile in-memory storage.
    # RENDER_GIT_COMMIT is supplied automatically by Render. LOG_LEVEL is unused.
