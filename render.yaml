# Adapted from CDS212 week 6
services:
  - type: web
    name: shelfops
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Wait for CI. Step 10 will switch this to off when using a deploy hook.
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8000"
      # Without DATABASE_URL, every worker would have its own in-memory data.
      - key: GUNICORN_WORKERS
        value: "1"
    # No database or disk: this lab instance uses volatile in-memory storage.
    # APP_VERSION and LOG_LEVEL are not yet consumed by ShelfOps.
